context:
  version: "0.72.0"

package:
  name: difftastic
  version: ${{ version }}

source:
  url: https://github.com/Wilfred/difftastic/archive/${{ version }}.tar.gz
  sha256: ed8e2d59d44d62289b17c9d241e469bd72565fadf13c260676fc7a23bc28a844

build:
  number: 0
  skip: win or ppc64le

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - make

tests:
  - script:
      - difft --help

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Diff that understands syntax
  homepage: https://github.com/Wilfred/difftastic
  repository: https://github.com/Wilfred/difftastic

extra:
  recipe-maintainers:
    - danielnachun
