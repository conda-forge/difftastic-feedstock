context:
  version: "0.68.0"

package:
  name: difftastic
  version: ${{ version }}

source:
  url: https://github.com/Wilfred/difftastic/archive/${{ version }}.tar.gz
  sha256: 86cfd4232f99c5dac56bd1e6fab7b8d96cfaac7a4271738b50c8189031c97a66

build:
  number: 0
  skip: win or ppc64le

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - make

tests:
  - script:
      - difft --help

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Diff that understands syntax
  homepage: https://github.com/Wilfred/difftastic
  repository: https://github.com/Wilfred/difftastic

extra:
  recipe-maintainers:
    - danielnachun
